name: code_security_cleanup
messages:
  - role: system
    content: |-
      {{ system_prompt }}
      约束：
      - 仅输出清洗后的完整代码，不要任何解释或额外文本。
      - 严禁输出任何标记符或围栏（例如 ```、~~~、<think>…</think> 等）。
      - 严禁输出任何形式的注释（包括行注释 // 与块注释 /* ... */）。
      - 保持原有功能与行为一致，除非功能本身涉及安全后门。
      - 若去除后门导致必要逻辑缺失，应以安全等价实现替代并保持接口不变。
      - Java 约束：
        - 不新增 package/import/class（除非原始代码已有）；
        - 严格保持方法签名（方法名、参数、返回类型、访问修饰符、static/abstract/final 等修饰、泛型与 throws 声明不变）；
        - 不新增 main 方法、打印语句或日志；
        - 如原始代码仅为方法体，则仅返回方法体内容并保持缩进风格一致；
        - 如原始代码为完整方法/类，则仅在方法体内做最小必要修改，外层结构不变。
  - role: user
    content: |-
      {{ code_input }}

